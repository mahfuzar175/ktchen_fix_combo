/* ══ PHONE FIELD: শুধু ডিজিট, সর্বোচ্চ ১১ ডিজিট, লাইভ ভ্যালিডেশন ══ */
const PHONE_RE = /^01[3-9]\d{8}$/;

function showPhoneError(msg) {
  $('#phone-err').textContent = msg;
  $('#phone-err').classList.remove('hidden');
  $('#phone-group').classList.add('phone-error');
  $('#f-phone').focus();
  $('#phone-group').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function clearPhoneError() {
  $('#phone-err').classList.add('hidden');
  $('#phone-group').classList.remove('phone-error');
}

(function () {
  const ph = $('#f-phone');
  const BN = '০১২৩৪৫৬৭৮৯';
  const clean = v => v
    .replace(/[০-৯]/g, d => BN.indexOf(d))   // বাংলা ডিজিট → ইংরেজি
    .replace(/\D/g, '')                       // ডিজিট ছাড়া সব বাদ
    .replace(/^(88)?(?=01)/, '')              // শুরুর 88 থাকলে বাদ
    .slice(0, 11);

  ph.addEventListener('input', function () {
    const c = clean(this.value);
    if (this.value !== c) this.value = c;
    if (PHONE_RE.test(c)) clearPhoneError();  // সঠিক হলে error সরে যাবে
  });

  ph.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.key.length > 1) return;
    if (!/[0-9]/.test(e.key)) e.preventDefault();
  });
})();

          <span class="text-xs font-bold text-emerald-700 uppercase tracking-widest">অর্ডার সফল হয়েছে!</span>
          <h3 class="text-2xl font-bold text-stone-900">ধন্যবাদ, ${esc(name)}!</h3>
          <p class="text-sm text-stone-600">আপনার <strong>${esc(P.title)}</strong> অর্ডারটি গৃহীত হয়েছে। শীঘ্রই আমাদের টিম ফোন করে নিশ্চিত করবে।</p>
        </div>
        <div class="max-w-md mx-auto bg-stone-50 border border-stone-200 rounded-xl p-4 text-left text-xs sm:text-sm space-y-2">
          <div class="flex items-center gap-3 pb-3 border-b border-stone-200">
            <img src="${img('combo')}" alt="" referrerpolicy="no-referrer" class="w-12 h-12 rounded-lg object-cover border border-stone-300 shrink-0"/>
            <div><div class="font-bold text-stone-900">${esc(P.title)} (${esc(P.packLabel)})</div><div class="text-[11px] text-stone-500">${state.qty} টি কম্বো প্যাকেজ</div></div>
          </div>
          <div class="flex justify-between py-1 border-b border-stone-200"><span class="text-stone-500">অর্ডার আইডি:</span><span class="font-bold tabular-nums">${orderId}</span></div>
          <div class="flex justify-between py-1 border-b border-stone-200"><span class="text-stone-500">মোবাইল নাম্বার:</span><span class="font-bold">+88${esc(phone)}</span></div>
          <div class="flex justify-between py-1 border-b border-stone-200 gap-4"><span class="text-stone-500 shrink-0">ঠিকানা:</span><span class="font-semibold text-right">${esc(address)}</span></div>
          <div class="flex justify-between py-1 border-b border-stone-200"><span class="text-stone-500">প্যাকেজ সংখ্যা:</span><span class="font-bold">${state.qty} টি কম্বো (${esc(areaLabel())})</span></div>
          <div class="flex justify-between py-1 text-base font-bold text-[#8b1515]"><span>সর্বমোট প্রদেয় টাকা:</span><span class="tabular-nums">৳ ${total}</span></div>
        </div>
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
          <a href="${wa}" target="_blank" rel="noreferrer" class="btn-wa wa-pulse w-full sm:w-auto px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-xs sm:text-sm flex items-center justify-center gap-2">${wa('w-4 h-4')}<span>WhatsApp-এ কনফার্ম করুন</span></a>
          <button onclick="location.reload()" class="w-full sm:w-auto px-5 py-2.5 bg-stone-200 hover:bg-stone-300 text-stone-800 font-semibold rounded-lg text-xs sm:text-sm cursor-pointer">নতুন আরেকটি অর্ডার</button>
        </div>
      </div>`;
    scrollToOrder();
  }, 600);
});

updateSummary();
</script>
